[package]
name = "nes-emu-egui"
version = "0.1.0"
edition = "2024"

#[profile.release]
#panic = "abort"
#lto = "fat"
#codegen-units = 1

[dependencies]
eframe = { version = "0.36.1", features = ["persistence"] }
egui_extras = { version = "0.36.1", features = ["image", "svg"]}
#image = { version = "0.24.7", features = ["png"] }
rfd = "0.17.2"
fastrand = "2.5.0"
cpal = "0.18.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
typetag = "0.2.23"
dyn-clone = "1.0.20"
gilrs = { version = "0.11.2", features = ["serde-serialize"] }
uuid = { version = "1.26.0" , features = ["serde"]}
